{% extends 'base.html' %}{% block title %}Edit Absensi - Absensi{% endblock %}{% block content %}<div class="topbar"><div><h1>Edit Absensi</h1><div class="muted">Perbaiki data tanpa membuat duplikat.</div></div></div><div class="panel"><form method="POST"><div class="form-grid"><div class="field full"><label>Karyawan *</label><select name="karyawan_id" required>{% for k in daftar_karyawan %}<option value="{{ k.id }}" {% if k.id==absensi.karyawan_id %}selected{% endif %}>{{ k.nik }} - {{ k.nama }}</option>{% endfor %}</select></div><div class="field"><label>Tanggal *</label><input type="date" name="tanggal" value="{{ absensi.tanggal.isoformat() }}" required></div><div class="field"><label>Status *</label><select name="status" required>{% for s in ['Masuk','Sakit','Izin','Tidak Masuk'] %}<option value="{{ s }}" {% if absensi.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div><div class="field"><label>Jam Masuk</label><input type="time" name="jam_masuk" value="{{ absensi.jam_masuk.strftime('%H:%M') if absensi.jam_masuk else '' }}"></div><div class="field"><label>Jam Pulang</label><input type="time" name="jam_pulang" value="{{ absensi.jam_pulang.strftime('%H:%M') if absensi.jam_pulang else '' }}"></div><div class="field full"><label>Keterangan</label><textarea name="keterangan">{{ absensi.keterangan or '' }}</textarea></div></div>{% if error %}<div class="flash error" style="margin-top:15px">{{ error }}</div>{% endif %}<div class="form-actions"><button class="btn">Simpan Perubahan</button><a class="btn gray" href="{{ url_for('absensi', tanggal=absensi.tanggal.isoformat()) }}">Batal</a></div></form></div>{% endblock %}
