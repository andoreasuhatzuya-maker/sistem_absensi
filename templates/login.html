<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login - Sistem Absensi</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eef2f7;font-family:Arial,sans-serif;color:#1f2937}.box{width:100%;max-width:410px;background:#fff;padding:34px;border-radius:16px;box-shadow:0 12px 35px rgba(15,23,42,.1)}h1{text-align:center;margin:0 0 5px}.sub{text-align:center;color:#6b7280;font-size:13px;margin-bottom:25px}.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px}.btn{width:100%;padding:12px;background:#2563eb;border:0;color:white;border-radius:8px;font-weight:700;cursor:pointer}.error{background:#fee2e2;color:#991b1b;padding:11px;border-radius:8px;font-size:13px;margin-bottom:15px}.hint{text-align:center;color:#9ca3af;font-size:11px;margin-top:18px}</style></head>
<body><div class="box"><h1>ABSENSI KARYAWAN</h1><div class="sub">Login Administrator</div>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST"><div class="field"><label>Username</label><input name="username" required autofocus></div><div class="field"><label>Password</label><input type="password" name="password" required></div><button class="btn">Masuk</button></form><div class="hint">Gunakan akun admin yang sudah dibuat.</div></div></body></html>
