{% extends 'base.html' %}{% block title %}Edit Karyawan - Absensi{% endblock %}{% block content %}<div class="topbar"><div><h1>Edit Karyawan</h1><div class="muted">Perubahan tidak menghapus riwayat absensi.</div></div></div><div class="panel"><form method="POST"><div class="form-grid"><div class="field"><label>NIK *</label><input name="nik" value="{{ karyawan.nik }}" required></div><div class="field"><label>Nama Lengkap *</label><input name="nama" value="{{ karyawan.nama }}" required></div><div class="field"><label>Jabatan *</label><input name="jabatan" value="{{ karyawan.jabatan }}" required></div><div class="field"><label>Departemen</label><input name="departemen" value="{{ karyawan.departemen or '' }}"></div></div>{% if error %}<div class="flash error" style="margin-top:15px">{{ error }}</div>{% endif %}<div class="form-actions"><button class="btn">Simpan Perubahan</button><a class="btn gray" href="{{ url_for('karyawan') }}">Batal</a></div></form></div>{% endblock %}
