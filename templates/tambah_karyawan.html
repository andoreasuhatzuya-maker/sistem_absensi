{% extends 'base.html' %}{% block title %}Tambah Karyawan - Absensi{% endblock %}{% block content %}<div class="topbar"><div><h1>Tambah Karyawan</h1><div class="muted">Data ini akan menjadi daftar karyawan aktif.</div></div></div><div class="panel"><form method="POST"><div class="form-grid"><div class="field"><label>NIK *</label><input name="nik" value="{{ request.form.get('nik','') }}" required></div><div class="field"><label>Nama Lengkap *</label><input name="nama" value="{{ request.form.get('nama','') }}" required></div><div class="field"><label>Jabatan *</label><input name="jabatan" value="{{ request.form.get('jabatan','') }}" placeholder="Operator / Satpam / Admin" required></div><div class="field"><label>Departemen</label><input name="departemen" value="{{ request.form.get('departemen','') }}" placeholder="Produksi / Security / dll"></div></div>{% if error %}<div class="flash error" style="margin-top:15px">{{ error }}</div>{% endif %}<div class="form-actions"><button class="btn">Simpan Karyawan</button><a class="btn gray" href="{{ url_for('karyawan') }}">Batal</a></div></form></div>{% endblock %}
